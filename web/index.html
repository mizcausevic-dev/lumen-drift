<!doctype html>
<html lang="en" data-theme="cosmic" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var theme = localStorage.getItem("lumen-theme");
        var mode = localStorage.getItem("lumen-mode");
        var allowed = ["bento", "cosmic", "swiss", "aqua", "brutal", "steel", "parchment"];
        if (theme && allowed.indexOf(theme) !== -1) document.documentElement.dataset.theme = theme;
        if (mode === "light" || mode === "dark") document.documentElement.dataset.mode = mode;
      } catch (e) {}
    </script>
